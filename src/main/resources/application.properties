# ===================================================================
# Product Inventory Management System - Application Configuration
# ===================================================================

# Server runs on port 8081 so it does not conflict if your student project is running on 8080
server.port=8081

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
